<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Compras</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <link rel="stylesheet" href="./src/styles/style.css" />
  </head>
  <body>
    <header>
      <img src="./src/public/logo.svg" alt="Shopping List logo" />
    </header>
    <div class="container">
      <h2>Compras da semana</h2>
      <form id="add-task">
        <input id="name-task" type="text" placeholder="Adicione um novo item" />
        <button id="btn-add" type="submit">Adicionar item</button>
      </form>
      <ul id="list-taks">
        <!-- <li>
          <label id="task">
            <input id="checkbox" type="checkbox" />
            <p>Pão francês</p>
          </label>
          <button id="delete-task">
            <ion-icon name="trash-outline"></ion-icon>
          </button>
        </li> -->
      </ul>
      <footer class="remove-task-hidden">
        <img src="./src/public/warning-circle-filled.svg" alt="Warning Icon" />
        <span>item foi removido da lista</span>
        <button id="remove-task-btn">
          <ion-icon name="close"></ion-icon>
        </button>
      </footer>
    </div>

    <script type="module" src="/src/main.js" defer></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
